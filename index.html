  panel.addEventListener('click',async event=>{const trigger=event.target.closest('[data-copy-email]');if(!trigger)return;event.preventDefault();const address=trigger.dataset.copyEmail;let copied=false;try{await navigator.clipboard.writeText(address);copied=true;}catch(e){const field=document.createElement('textarea');field.value=address;field.readOnly=true;field.style.position='fixed';field.style.opacity='0';document.body.append(field);field.select();try{copied=document.execCommand('copy');}catch(error){}field.remove();}if(copied){playUISound('copy');notice((state.lang==='ru'?'Скопировано: ':'Copied: ')+address,true);}else notice(state.lang==='ru'?'Не удалось скопировать адрес.':'Could not copy the address.',false);});
  function formatTime(v){if(!Number.isFinite(v)||v<0)return '0:00';return Math.floor(v/60)+':'+String(Math.floor(v%60)).padStart(2,'0');}
  function filenameInfo(name){const stem=name.replace(/\.[^.]+$/,'').replace(/[_]+/g,' ').trim();const match=stem.match(/^(.{1,70}?)\s+-\s+(.{1,120})$/);return match?{title:match[2].trim(),artist:match[1].trim()}:{title:stem||name,artist:text('unknownArtist')};}
  function renderTracks(){const list=document.getElementById('hlTrackList');if(!list)return;const counter=document.getElementById('hlTrackCount');counter.textContent=state.tracks.length+' '+text('trackCount');list.replaceChildren();if(!state.tracks.length){const empty=document.createElement('div');empty.className='hl-empty';empty.textContent=text('emptyTracks');list.append(empty);return;}state.tracks.forEach((track,i)=>{const button=document.createElement('button');button.type='button';button.className='hl-track'+(i===state.index?' active':'');const art=document.createElement('span');art.className='hl-track-art';art.textContent=(track.title[0]||'♪').toUpperCase();const body=document.createElement('span');body.className='hl-track-text';const title=document.createElement('strong');title.textContent=track.title;const artist=document.createElement('span');artist.textContent=track.artist;body.append(title,artist);const dur=document.createElement('span');dur.className='hl-track-time';dur.textContent=Number.isFinite(track.duration)?formatTime(track.duration):'--:--';button.append(art,body,dur);button.addEventListener('click',()=>playTrack(i,true));list.append(button);});}
  function setPlayState(playing){const b=document.getElementById('hlPlay');if(!b)return;b.textContent=playing?'Ⅱ':'▶';b.setAttribute('aria-label',playing?text('pause'):text('play'));}
  function updateCurrent(){const track=state.tracks[state.index];if(!track)return;const title=document.getElementById('hlNowTitle');const artist=document.getElementById('hlNowArtist');if(title)title.textContent=track.title;if(artist)artist.textContent=track.artist;renderTracks();}
  async function playTrack(index,autoplay){if(!state.tracks.length){notice(text('needTracks'));return;}state.index=(index+state.tracks.length)%state.tracks.length;audio.src=state.tracks[state.index].url;audio.load();updateCurrent();if(autoplay){try{await audio.play();setPlayState(true);}catch(e){setPlayState(false);notice(text('cantPlay'));}}}
  function addFiles(fileList){const accepted=Array.from(fileList||[]).filter(f=>f.type.startsWith('audio/')||/\.(mp3|wav|flac|ogg|m4a|aac|opus|wma|aiff?)$/i.test(f.name));if(!accepted.length){notice(text('noAudio'));return;}accepted.forEach(file=>{const parsed=filenameInfo(file.name);state.tracks.push({file:file,url:URL.createObjectURL(file),title:parsed.title,artist:parsed.artist,duration:NaN});});renderTracks();notice(text('added')(accepted.length));if(state.index<0)playTrack(0,true);}
  function bindPlayer(){renderTracks();const input=document.getElementById('hlAudioInput');document.getElementById('hlPickAudio').addEventListener('click',()=>input.click());input.addEventListener('change',()=>{addFiles(input.files);input.value='';});const drop=document.getElementById('hlDrop');['dragenter','dragover'].forEach(name=>drop.addEventListener(name,e=>{e.preventDefault();drop.style.background='rgba(120,222,218,.1)';}));['dragleave','drop'].forEach(name=>drop.addEventListener(name,e=>{e.preventDefault();drop.style.background='';}));drop.addEventListener('drop',e=>addFiles(e.dataTransfer.files));document.getElementById('hlPlay').addEventListener('click',async()=>{if(state.index<0){if(state.tracks.length)await playTrack(0,true);else notice(text('needTracks'));return;}if(audio.paused){try{await audio.play();setPlayState(true);}catch(e){notice(text('cantPlay'));}}else audio.pause();});document.getElementById('hlPrev').addEventListener('click',()=>{if(!state.tracks.length)return notice(text('needTracks'));if(audio.currentTime>3){audio.currentTime=0;return;}playTrack(state.index-1,true);});document.getElementById('hlNext').addEventListener('click',()=>{if(!state.tracks.length)return notice(text('needTracks'));playTrack(state.index+1,true);});const repeat=document.getElementById('hlRepeat');const syncRepeat=()=>{repeat.textContent='↻ '+text(state.repeat?'repeatAll':'repeatOff');repeat.setAttribute('aria-pressed',String(state.repeat));};syncRepeat();repeat.addEventListener('click',()=>{state.repeat=!state.repeat;syncRepeat();});const volume=document.getElementById('hlVolume');volume.value=Math.round(audio.volume*100);document.getElementById('hlVolumeText').textContent=volume.value+'%';volume.addEventListener('input',()=>{audio.volume=Number(volume.value)/100;document.getElementById('hlVolumeText').textContent=volume.value+'%';});const seek=document.getElementById('hlSeek');seek.addEventListener('input',()=>{state.seeking=true;if(Number.isFinite(audio.duration))document.getElementById('hlCurrent').textContent=formatTime(audio.duration*Number(seek.value)/1000);});seek.addEventListener('change',()=>{if(Number.isFinite(audio.duration))audio.currentTime=audio.duration*Number(seek.value)/1000;state.seeking=false;});}
  audio.volume=.75;audio.addEventListener('loadedmetadata',()=>{if(state.index>=0&&state.tracks[state.index]){state.tracks[state.index].duration=audio.duration;renderTracks();}const d=document.getElementById('hlDuration');if(d)d.textContent=formatTime(audio.duration);});audio.addEventListener('timeupdate',()=>{const seek=document.getElementById('hlSeek');if(seek&&!state.seeking&&Number.isFinite(audio.duration)&&audio.duration>0)seek.value=String(Math.round(audio.currentTime/audio.duration*1000));const c=document.getElementById('hlCurrent');const d=document.getElementById('hlDuration');if(c)c.textContent=formatTime(audio.currentTime);if(d)d.textContent=formatTime(audio.duration);});audio.addEventListener('play',()=>setPlayState(true));audio.addEventListener('pause',()=>setPlayState(false));audio.addEventListener('ended',()=>{if(state.index<state.tracks.length-1)playTrack(state.index+1,true);else if(state.repeat&&state.tracks.length)playTrack(0,true);else setPlayState(false);});audio.addEventListener('error',()=>{if(state.index>=0)notice(text('cantPlay'));});
  function renderThemeMenu(){const labels=state.lang==='ru'?{auto:'Система',light:'Светлая',dark:'Тёмная'}:{auto:'System',light:'Light',dark:'Dark'};const symbols={auto:'◐',light:'☼',dark:'◑'};document.getElementById('hlNewThemeLabel').textContent=symbols[state.theme]+' '+labels[state.theme];themeMenu.querySelectorAll('[data-hl-theme]').forEach(button=>{const mode=button.dataset.hlTheme;button.setAttribute('aria-checked',String(mode===state.theme));button.querySelector('[data-hl-theme-label]').textContent=labels[mode];});}
  function closeThemeMenu(){themeToggle.setAttribute('aria-expanded','false');themeMenu.classList.remove('open');window.setTimeout(()=>{if(!themeMenu.classList.contains('open'))themeMenu.hidden=true;},200);}
  function openThemeMenu(){themeMenu.hidden=false;themeToggle.setAttribute('aria-expanded','true');requestAnimationFrame(()=>themeMenu.classList.add('open'));}
  function applyLanguage(){document.documentElement.lang=state.lang;langButton.textContent=state.lang==='ru'?'EN':'RU';document.getElementById('hlNewBrandSub').textContent=text('brandSub');tabs.forEach(tab=>{const key=tab.querySelector('[data-hl-label]')?.dataset.hlLabel;if(key)tab.querySelector('[data-hl-label]').textContent=text(key);});renderProject();renderThemeMenu();}
  tabs.forEach(tab=>tab.addEventListener('click',()=>{playUISound('select');selectProject(tab.dataset.hlProject);}));
  document.getElementById('hlNewHome').addEventListener('click',e=>{e.preventDefault();selectProject('overview');});
  langButton.addEventListener('click',()=>{state.lang=state.lang==='ru'?'en':'ru';applyLanguage();});
  try{state.theme=localStorage.getItem('handylabs-theme')||'auto';}catch(e){}if(!['auto','light','dark'].includes(state.theme))state.theme='auto';root.dataset.theme=state.theme;renderThemeMenu();
  themeToggle.addEventListener('click',()=>{if(themeToggle.getAttribute('aria-expanded')==='true')closeThemeMenu();else openThemeMenu();});
  themeMenu.querySelectorAll('[data-hl-theme]').forEach(button=>button.addEventListener('click',()=>{state.theme=button.dataset.hlTheme;root.dataset.theme=state.theme;try{localStorage.setItem('handylabs-theme',state.theme);}catch(e){}renderThemeMenu();closeThemeMenu();refreshGlassForThemeChange();playUISound('select');}));
  document.addEventListener('click',event=>{if(!event.target.closest('.hl-theme-wrap'))closeThemeMenu();});
  document.addEventListener('keydown',event=>{if(event.key==='Escape')closeThemeMenu();});
  applyLanguage();document.documentElement.dataset.handyLiquidGlass='loading';
  const cdn='https://cdn.jsdelivr.net/npm/@ybouane/liquidglass@1.0.3/dist/index.js';
  const setConfig=(el,config)=>{el.dataset.config=JSON.stringify(config);};
  const sharedGlassConfig={blurAmount:.12,refraction:.82,chromAberration:.018,edgeHighlight:.09,specular:.035,fresnel:.68,distortion:.008,cornerRadius:28,zRadius:20,opacity:.54,saturation:.08,tintStrength:.16,brightness:-.045,shadowOpacity:.16,shadowSpread:14,shadowOffsetY:3};
  function refreshGlassForThemeChange(){
    navGlassInstance?.markChanged();
    const marker=document.createComment('liquid-glass-theme-refresh');
    panel.appendChild(marker);
    marker.remove();
  }
  (async()=>{
    try{
      const mod=await import(cdn);
      const LiquidGlass=mod.LiquidGlass;
      setConfig(indicator,{blurAmount:.04,refraction:.9,chromAberration:.012,edgeHighlight:.13,specular:.035,fresnel:.7,cornerRadius:15,zRadius:17,opacity:.72,saturation:.08,tintStrength:.16,brightness:-.035,shadowOpacity:.11,shadowSpread:8,shadowOffsetY:2});
      setConfig(panel,sharedGlassConfig);
      const [navInstance,panelInstance]=await Promise.all([
        LiquidGlass.init({root:navRoot,glassElements:[indicator],defaults:sharedGlassConfig}),
        LiquidGlass.init({root:panelRoot,glassElements:[panel],defaults:sharedGlassConfig})
      ]);
      navGlassInstance=navInstance;
      panelGlassInstance=panelInstance;
      document.documentElement.dataset.handyLiquidGlass='ready';
    }catch(err){
      document.documentElement.dataset.handyLiquidGlass='fallback';
      console.warn('LiquidGlass initialization failed; using CSS fallback.',err);
    }
  })();
  window.addEventListener('beforeunload',()=>state.tracks.forEach(track=>URL.revokeObjectURL(track.url)));
})();
</script>
</body>
